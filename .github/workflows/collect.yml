# ตัวเก็บสด — job เดียววนลูปยาว 5 ชม. 45 นาที แล้วออกเอง โดยมี cron ทุก 10 นาทีเป็นยามปลุกต่อ
#
# ทำไมไม่ใช้ cron ตรง ๆ: `schedule:` ต่ำสุด 5 นาทีและถูกข้ามเมื่อระบบโหลดสูง ส่วนจังหวะที่ต้องการ
# คือ 2 นาที จังหวะจึงต้องมาจากลูปข้างในโปรเซส ไม่ใช่จากตัวตั้งเวลาของ GitHub
#
# cron เป็นยาม ไม่ใช่คนขับ: รอบที่ยิงมาระหว่างที่ตัวเก็บยังวิ่งอยู่จะไม่ฆ่าตัวเดิม แต่ไปนั่งรอในคิว
# แล้วเริ่มทันทีที่กลุ่มว่าง ไม่ว่าตัวเดิมจะจบตามกำหนดหรือตายกลางทาง ตัวที่นั่งรออยู่นี่แหละคือยาม
# ตัวจริง ไม่ใช่ตัวเวลาของ cron
#
# ช่องโหว่จึงไม่ใช่ "ยามมาช้า" แต่เป็น "ช่วงที่คิวว่างเปล่า" — นับจากวินาทีที่ตัวรอถูกเลื่อนขึ้นมาวิ่ง
# จนกว่ารอบถัดไปจะมาเติมคิว ถ้าตัวเก็บตายในช่วงนั้นจะไม่มีใครมารับช่วง วัดจริงเมื่อ 2026-09-12
# ตอนยิงรายชั่วโมง: รอบที่ถึงจริงห่างกัน 2.5–4.7 ชม. เพราะ GitHub ทิ้งรอบที่ตั้งเวลาไว้เกินครึ่ง
# ช่องว่างจึงยาวได้ถึงราว 4.7 ชม.
#
# ยิงถี่ขึ้นเพื่อเติมคิวให้เร็วขึ้น และมันไม่ทำให้งานกองซ้อน เพราะคิวของ concurrency group จุได้
# ตัวเดียว รอบใหม่ที่มาระหว่างมีตัวรออยู่แล้วจะยกเลิกตัวเก่าแล้วนั่งแทน ราคาที่จ่ายคือรอบที่ถูก
# ยกเลิกจะโผล่ในประวัติการรันวันละหลายสิบรอบ ซึ่งเป็นแค่ความรก ไม่กินนาที Actions
name: collect

on:
  schedule:
    # ทุก 10 นาที และเลี่ยงนาทีศูนย์ทุกจุด — นาทีศูนย์เป็นช่วงที่คิวของ GitHub แออัดที่สุด
    # และเป็นช่วงที่รอบที่ตั้งเวลาไว้ถูกหน่วงหรือถูกข้ามทิ้งบ่อยที่สุด ยามที่ไม่มาคือช่องว่างในข้อมูล
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      seconds:
        # สั่งรันเองแบบสั้น ๆ ไว้ทดสอบว่าขาเตรียมที่เก็บ ขาเก็บ และขาปิดท้ายต่อกันติด
        # โดยไม่ต้องรอเต็มเวลา — ยามที่มาตามเวลาใช้ค่าตั้งต้นเสมอ
        description: "ตัวเก็บเดินกี่วินาทีแล้วออก (20700 = 5 ชม. 45 นาที เท่าของจริง)"
        default: "20700"

# ห้ามฆ่าตัวที่วิ่งอยู่ ให้ตัวใหม่รอคิวแทน — ถ้าตั้งเป็นฆ่า ยามจะกลายเป็นตัวฆ่าตัวเก็บทุก 10 นาที
# โดยที่อาการจะดูเหมือนทุกอย่างปกติ บรรทัดนี้สำคัญขึ้นตามความถี่ของ cron ห้ามแตะ
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read        # โทเคนอัตโนมัติไม่ต้องเขียนอะไร ข้อมูลไปอีก repo ด้วย deploy key

jobs:
  collect:
    runs-on: ubuntu-latest
    # เพดานของ job คือ 6 ชม. ตัวเก็บออกเองที่ 5:45 เหลือขอบให้ขั้นตอนปิดท้ายได้ push ทัน
    timeout-minutes: 355
    env:
      # ที่อยู่ของสองโคลนถูกประกาศลง $GITHUB_ENV ในขั้นเตรียม เพราะ runner.temp
      # ใช้ในบล็อก env ระดับ job ไม่ได้
      DATA_REPO: ${{ github.repository_owner }}/freelance-market-data
    steps:
      - uses: actions/checkout@v5

      - name: เตรียมที่เก็บข้อมูลและสถานะ
        env:
          FM_DATA_SSH_KEY: ${{ secrets.FM_DATA_SSH_KEY }}
        run: ci/bootstrap.sh

      - name: push ข้อมูลทุก 15 นาทีระหว่างที่ตัวเก็บวิ่ง
        run: ci/push_loop.sh &

      - name: เก็บ
        run: |
          python3 freelance-market/collect.py \
            --data-dir "$DATA" \
            --max-seconds "${{ inputs.seconds || 20700 }}" \
            --verbose

      - name: push ข้อมูลรอบสุดท้ายและ commit สถานะ
        if: always()
        run: ci/finish.sh

      - name: การ push ระหว่างทางเคยพังไหม
        if: always()
        # push ที่พังจะเงียบสนิทโดยธรรมชาติ ตัวเก็บยังวิ่งต่อได้ตามปกติ จึงต้องบังคับให้ job แดง
        # เพื่อให้ GitHub ส่งเมลเอง — โทเคนหมดอายุถูกจับด้วยกลไกนี้ ไม่ใช่ด้วยการตั้งอายุยาว
        run: |
          if [ -f "$RUNNER_TEMP/push-failed" ]; then
            echo "::error::push ระหว่างทางล้มเหลว — ดูรายละเอียดด้านล่าง"
            cat "$RUNNER_TEMP/push-failed"
            exit 1
          fi
          echo "push ระหว่างทางผ่านทุกรอบ"
